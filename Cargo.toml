[workspace]
members = [
    "crates/protocol",
    "crates/transport",
    "crates/client",
    "crates/bench",
    "crates/server",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
iroh = { git = "https://github.com/usagi-coffee/iroh", branch = "bindtodevice" }
libc = "0.2"
parking_lot = "0.12"
protocol = { path = "crates/protocol" }
transport = { path = "crates/transport" }
rand = "0.9"
ratatui = "0.29"
tokio = { version = "1.48", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

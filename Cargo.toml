[workspace]
members = [
    "crates/cli",
    "crates/protocol",
    "crates/transport",
    "crates/identity",
    "crates/obs-remote",
    "crates/client-remote",
    "crates/client",
    "crates/bench",
    "crates/server",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bluer = { version = "0.17", features = ["bluetoothd"] }
bytes = "1.11"
cli = { path = "crates/cli" }
client-remote = { path = "crates/client-remote" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
data-encoding = "2.10"
iroh = { git = "https://github.com/usagi-coffee/iroh", branch = "bindtodevice" }
libc = "0.2"
modular-bitfield = "0.12"
obs-remote = { path = "crates/obs-remote" }
obws = "0.15"
parking_lot = "0.12"
protocol = { path = "crates/protocol" }
transport = { path = "crates/transport" }
rand = "0.10"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1.19"

[patch.crates-io]
netwatch = { git = "https://github.com/usagi-coffee/net-tools" }
